name: smoke
on: [push, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Python 语法检查
        run: python -m py_compile excel2data.py tools/*.py
      - name: 数据断言
        run: python tools/test_data.py
      - name: 前端构建
        run: |
          npm ci
          npm run build
      - name: 产物冒烟
        run: |
          test -f dist/index.html
          test -f dist/sites.csv
          test -f dist/columns.json
