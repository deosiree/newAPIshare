<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="免费公益站统计合集(持续更新中):AI 中转公益站导航、状态、奖励、体验与多源评价。">
<meta name="theme-color" content="#3b6ef5">
<title>免费公益站统计合集 · 持续更新中</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --card2:#eef1f6; --hover:#f0f4ff; --text:#1b1f24; --muted:#69707a;
  --line:#e4e8ee; --accent:#3b6ef5; --accent-weak:#eaf0ff;
  --ok-bg:#e5f6ec; --ok-tx:#177a3d; --dead-bg:#fdeaea; --dead-tx:#b3372f;
  --unk-bg:#eef0f3; --unk-tx:#5c636e;
  --b-top-bg:#f6edff; --b-top-tx:#7a3fd1; --b-hong-bg:#e7f0ff; --b-hong-tx:#2563eb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101317; --card:#191d23; --card2:#20252c; --hover:#1f2733; --text:#e9ecf1; --muted:#9aa3ae;
    --line:#2a3038; --accent:#6d95ff; --accent-weak:#20304d;
    --ok-bg:#12301e; --ok-tx:#5ad188; --dead-bg:#38191a; --dead-tx:#f08d84;
    --unk-bg:#252a31; --unk-tx:#9aa3ae;
    --b-top-bg:#2c2140; --b-top-tx:#c39bf5; --b-hong-bg:#1c2a45; --b-hong-tx:#8fb2ff;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text); overflow:hidden;
  font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.page{height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:1280px; margin:0 auto; padding:0 14px}
/* ---- 头部 ---- */
header.top{padding:14px 2px 8px; flex:0 0 auto}
header.top h1{margin:0; font-size:20px; line-height:1.3; display:inline}
header.top .tag{
  font-size:12px; color:var(--muted); font-weight:400; margin-left:8px;
  border:1px solid var(--line); border-radius:999px; padding:1px 9px; vertical-align:2px;
}
header.top .pv{
  font-size:12px; color:var(--ok-tx); font-weight:600; margin-left:8px;
  background:var(--ok-bg); border-radius:999px; padding:2px 10px;
}
header.top .sub{margin:4px 0 0; color:var(--muted); font-size:12.5px}
header.top .sub b{color:var(--accent); font-weight:600}
/* ---- 工具栏 ---- */
.toolbar{flex:0 0 auto; padding:2px 0 8px}
.bar{display:flex; gap:8px; align-items:center}
#q{
  flex:1; min-width:0; padding:9px 13px; border-radius:11px; border:1px solid var(--line);
  background:var(--card); color:var(--text); font-size:14px; outline:none;
}
#q:focus{border-color:var(--accent)}
#count{flex:0 0 auto; color:var(--muted); font-size:12.5px; white-space:nowrap}
.chips{display:flex; gap:7px; overflow-x:auto; padding:7px 1px 1px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:4px 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--card); color:var(--muted); font-size:12.5px; cursor:pointer;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.chip .n{opacity:.6; font-size:11.5px; margin-left:3px}
.chip.on{background:var(--accent-weak); border-color:var(--accent); color:var(--accent); font-weight:600}
/* ---- 同步面板(仅私人视图) ---- */
.panel{
  flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:0 0 8px; padding:8px 12px; border:1px dashed var(--accent);
  border-radius:12px; background:var(--accent-weak); font-size:13px;
}
.panel .dot{width:9px; height:9px; border-radius:50%; background:var(--unk-tx); flex:0 0 auto}
.panel .dot.ok{background:var(--ok-tx)} .panel .dot.bad{background:var(--dead-tx)}
.panel b{font-size:13px}
.panel .msg{color:var(--muted); font-size:12.5px}
.pbtn{
  padding:6px 13px; border-radius:9px; border:1px solid var(--accent);
  background:var(--accent); color:#fff; font-size:13px; font-weight:600; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.pbtn:disabled{opacity:.55; cursor:wait}
.pbtn.ghost{background:transparent; color:var(--accent)}
/* ---- 表格 ---- */
.tablewrap{
  flex:1 1 auto; overflow:auto; min-height:120px;
  border:1px solid var(--line); border-radius:14px; background:var(--card);
}
table{border-collapse:separate; border-spacing:0; width:max-content; min-width:100%}
th,td{
  padding:8px 12px; border-bottom:1px solid var(--line); font-size:13.5px;
  text-align:left; vertical-align:top; word-break:break-word;
}
thead th{
  position:sticky; top:0; z-index:2; background:var(--card2);
  font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap;
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hover)}
th.stick,td.stick{position:sticky; left:0; z-index:1; background:var(--card); font-weight:600}
thead th.stick{z-index:3}
tbody tr:hover td.stick{background:var(--hover)}
.nw{white-space:nowrap}
.m{min-width:120px; max-width:230px}
.l{min-width:190px; max-width:320px}
.clamp3{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
@media (max-width:760px){ .hs{display:none} }
.badge{display:inline-block; padding:1px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap}
.b-ok{background:var(--ok-bg); color:var(--ok-tx)}
.b-dead{background:var(--dead-bg); color:var(--dead-tx)}
.b-unk{background:var(--unk-bg); color:var(--unk-tx)}
.r-顶级{background:var(--b-top-bg); color:var(--b-top-tx)}
.r-夯,.r-饭多是夯{background:var(--b-hong-bg); color:var(--b-hong-tx)}
.r-NPC{background:var(--unk-bg); color:var(--unk-tx)}
.r-拉{background:var(--dead-bg); color:var(--dead-tx)}
td.act,th.act{
  position:sticky; right:0; white-space:nowrap;
  background:var(--card); border-left:1px solid var(--line);
  box-shadow:-10px 0 12px -10px rgba(0,0,0,.35);
}
thead th.act{z-index:3; background:var(--card2)}
tbody tr:hover td.act{background:var(--hover)}
.reg{
  display:inline-block; padding:5px 13px; border-radius:9px; background:var(--accent);
  color:#fff; font-size:12.5px; font-weight:600; text-decoration:none; -webkit-tap-highlight-color:transparent;
}
.reg:active{transform:scale(.96)}
.ck{
  display:inline-block; margin-left:6px; padding:4.5px 10px; border-radius:9px;
  border:1px solid var(--accent); color:var(--accent); background:var(--accent-weak);
  font-size:12px; font-weight:600; text-decoration:none; -webkit-tap-highlight-color:transparent;
}
.ck:active{transform:scale(.96)}
.empty{padding:50px 0; text-align:center; color:var(--muted); font-size:13.5px}
/* ---- 底部 ---- */
footer.foot{
  flex:0 0 auto; padding:8px 2px 10px; color:var(--muted); font-size:11.5px;
  display:flex; gap:4px 14px; flex-wrap:wrap; align-items:center;
}
footer.foot a{color:var(--accent); text-decoration:none}
/* ---- 预览弹窗 ---- */
.mask{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  width:min(860px,100%); max-height:86vh; display:flex; flex-direction:column;
}
.modal h3{margin:0; padding:14px 16px 10px; font-size:15px}
.modal .mbody{overflow:auto; padding:0 16px; flex:1}
.modal table{width:100%}
.modal th,.modal td{font-size:12.5px; padding:6px 8px}
.modal th{background:var(--card2); position:static}
.oldv{color:var(--muted); text-decoration:line-through; font-size:11.5px; max-width:220px}
.newv{color:var(--ok-tx); max-width:260px}
.mfoot{display:flex; gap:10px; align-items:center; padding:12px 16px; border-top:1px solid var(--line); flex-wrap:wrap}
.mfoot .grow{flex:1}
.mfoot label{font-size:12.5px; color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>免费公益站统计合集</h1><span class="tag">持续更新中</span><span class="pv" id="pvBadge" hidden>私人视图</span>
    <p class="sub" id="stats">加载中…</p>
  </header>

  <div class="toolbar">
    <div class="bar">
      <input id="q" type="search" placeholder="🔍 搜索站名 / 奖励 / 备注…" autocomplete="off">
      <span id="count"></span>
    </div>
    <div class="chips" id="statusChips"></div>
    <div class="chips" id="ratingChips"></div>
  </div>

  <div class="panel" id="panel" hidden>
    <span class="dot" id="srvDot"></span><b>编辑态工具面板</b>
    <span class="msg" id="srvMsg">检查本机同步助手…</span>
    <button class="pbtn" id="btnScan" disabled>检测 New API 渠道</button>
    <button class="pbtn ghost" id="btnLock" style="margin-left:auto">退出私人视图</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>没有匹配的站点,换个关键词或筛选条件试试</div>
    <noscript><div class="empty">本页需要启用 JavaScript。</div></noscript>
  </div>

  <footer class="foot">
    <span id="genInfo"></span>
    <span>数据整理 © 免费公益站统计合集 · 转载请保留出处 · 公益站随时可能跑路,请勿充值</span>
    <a id="adminLink" hidden target="_blank" rel="noopener noreferrer">管理数据 ↗</a>
  </footer>
</div>

<!-- 同步预览弹窗 -->
<div class="mask" id="mask" hidden>
  <div class="modal">
    <h3>同步预览 — 请确认要写入的变更</h3>
    <div class="mbody">
      <table>
        <thead><tr><th></th><th>站点</th><th>字段</th><th>当前值</th><th>检测值</th></tr></thead>
        <tbody id="pvBody"></tbody>
      </table>
      <div class="empty" id="pvEmpty" hidden>没有检测到需要更新的字段(全部一致或无匹配渠道)</div>
      <div class="empty" id="pvUnmatched" style="text-align:left"></div>
    </div>
    <div class="mfoot">
      <label><input type="checkbox" id="pvAll" checked> 全选</label>
      <span class="grow"></span>
      <button class="pbtn ghost" id="pvCancel">放弃</button>
      <button class="pbtn" id="pvApply">确认写入</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
/* ================= 配置 ================= */
var CONFIG = {
  privateKey: 'huiyan829',            // 访问 网址?k=此密钥 解锁私人视图(私列+工具面板);?k=off 退出
  syncUrl: 'http://localhost:8788',   // 本机同步助手地址(tools/启动同步工具.bat)
  editUrl: ''                         // 填入 GitHub 上 data.js 的编辑页链接后,底部出现「管理数据」入口
};
/* 列定义:type: name/status/rating/apistatus/link/普通文本
   pri:true = 私密列,公开访客不渲染,私人视图(?k=密钥)才显示。
   新增列:在 data.js 行对象里加字段后,这里加一行配置;不加配置的新字段会自动追加在链接列前。 */
var COLUMNS = [
  {key:'name',       label:'公益站',        type:'name',   cls:'stick nw'},
  {key:'status',     label:'状态',          type:'status', cls:'nw'},
  {key:'rating',     label:'评分',          type:'rating', cls:'nw'},
  {key:'register',   label:'注册',          cls:'m'},
  {key:'daily',      label:'每日签到',      cls:'m'},
  {key:'invite',     label:'邀请制',        cls:'m hs'},
  {key:'model',      label:'模型质量',      cls:'l hs'},
  {key:'exp',        label:'体验感',        pri:true,      cls:'l hs'},
  {key:'other',      label:'其他',          pri:true,      cls:'l hs'},
  {key:'other2',     label:'其他2·白嫖org',  cls:'l hs'},
  {key:'other3',     label:'其他3·飞书合集', cls:'l hs'},
  {key:'other4',     label:'其他4·幻城导航', cls:'l hs'},
  {key:'verified',   label:'验证',          cls:'nw'},
  {key:'models',     label:'模型',          pri:true,      cls:'l hs'},
  {key:'latency',    label:'响应',          pri:true,      cls:'nw'},
  {key:'api_status', label:'渠道状态',      type:'apistatus', pri:true, cls:'nw'},
  {key:'url',        label:'注册链接',      type:'link',   cls:'nw act'}
];

/* 签到地址等不在表格里单独成列的字段 */
var HIDDEN_KEYS = {checkin:1};

/* ================= 数据与状态 ================= */
var SITE = window.SITE_DATA || {};
var DATA = SITE.rows || [];
var state = { q:'', status:'all', rating:'all' };

function unlockedNow(){
  var k = new URLSearchParams(location.search).get('k');
  if (k === CONFIG.privateKey){ try{localStorage.setItem('pk','1');}catch(e){} }
  if (k === 'off'){ try{localStorage.removeItem('pk');}catch(e){} }
  var saved = false;
  try{ saved = localStorage.getItem('pk') === '1'; }catch(e){}
  return saved;
}
var UNLOCKED = unlockedNow();

function bucketOf(s){
  if (s === '有效' || s === '复活了') return 'ok';
  if (s === '失效' || s === '无效') return 'dead';
  return 'unknown';
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ================= 列装配(私人视图下自动追加未知字段列) ================= */
function buildCols(){
  var known = {}, cols = [];
  COLUMNS.forEach(function(c){ known[c.key] = 1; if (UNLOCKED || !c.pri) cols.push(c); });
  Object.keys(HIDDEN_KEYS).forEach(function(k){ known[k] = 1; });
  if (UNLOCKED && DATA.length){
    var seen = {};
    DATA.forEach(function(r){
      Object.keys(r).forEach(function(k){
        if (!known[k] && !seen[k]){
          seen[k] = 1;
          cols.push({key:k, label:k, cls:'m'});
        }
      });
    });
  }
  return cols;
}
var COLS = buildCols();

/* ================= 筛选 chips ================= */
var STATUS_CHIPS = [
  {key:'all',     label:'全部',      test:function(){return true;}},
  {key:'ok',      label:'有效',      test:function(s){return bucketOf(s)==='ok';}},
  {key:'dead',    label:'失效/无效', test:function(s){return bucketOf(s)==='dead';}},
  {key:'unknown', label:'未标注',    test:function(s){return bucketOf(s)==='unknown';}}
];
var RATING_ORDER = ['顶级','夯','NPC','拉'];
var ratings = [];
DATA.forEach(function(d){ if (d.rating && ratings.indexOf(d.rating)<0) ratings.push(d.rating); });
ratings.sort(function(a,b){
  var ia=RATING_ORDER.indexOf(a), ib=RATING_ORDER.indexOf(b);
  if(ia<0)ia=99; if(ib<0)ib=99; return ia-ib || a.localeCompare(b);
});
var RATING_CHIPS = [{key:'all',label:'全部评分',test:function(){return true;}}]
  .concat(ratings.map(function(r){
    return {key:r, label:r, test:function(s,rr){return rr===r;}};
  }));

function buildChips(el, chips, key){
  el.innerHTML = '';
  chips.forEach(function(c){
    var n = DATA.filter(function(d){ return c.test(d.status, d.rating); }).length;
    var b = document.createElement('button');
    b.className = 'chip' + (state[key]===c.key ? ' on' : '');
    b.innerHTML = esc(c.label) + '<span class="n">' + n + '</span>';
    b.onclick = function(){
      state[key] = c.key;
      buildChips(document.getElementById('statusChips'), STATUS_CHIPS, 'status');
      buildChips(document.getElementById('ratingChips'), RATING_CHIPS, 'rating');
      render();
    };
    el.appendChild(b);
  });
}

/* ================= 渲染 ================= */
function matches(d){
  if (state.status !== 'all'){
    var c = STATUS_CHIPS.filter(function(x){return x.key===state.status;})[0];
    if (c && !c.test(d.status, d.rating)) return false;
  }
  if (state.rating !== 'all'){
    var rc = RATING_CHIPS.filter(function(x){return x.key===state.rating;})[0];
    if (rc && !rc.test(d.status, d.rating)) return false;
  }
  if (state.q){
    var q = state.q.toLowerCase(), hay = [];
    Object.keys(d).forEach(function(k){ hay.push(d[k]); });
    if (hay.join(' ').toLowerCase().indexOf(q) < 0) return false;
  }
  return true;
}

function cellHTML(c, d){
  var v = d[c.key];
  if (c.type === 'name'){
    return '<td class="stick nw">' + esc(d.name) + '</td>';
  }
  if (c.type === 'status'){
    var st = bucketOf(d.status);
    return '<td class="nw"><span class="badge b-'+st+'">'+esc(d.status || '未标注')+'</span></td>';
  }
  if (c.type === 'rating'){
    if (!d.rating) return '<td></td>';
    return '<td class="nw"><span class="badge r-'+esc(d.rating)+'">'+esc(d.rating)+'</span></td>';
  }
  if (c.type === 'apistatus'){
    if (!v) return '<td></td>';
    var b = String(v).indexOf('正常')>=0 ? 'b-ok' : (String(v).indexOf('异常')>=0 ? 'b-dead' : 'b-unk');
    return '<td class="nw"><span class="badge '+b+'">'+esc(v)+'</span></td>';
  }
  if (c.type === 'link'){
    if (!d.url) return '<td></td>';
    var h = '<a class="reg" href="'+esc(d.url)+'" target="_blank" rel="noopener noreferrer">注册 ↗</a>';
    if (d.checkin){
      h += '<a class="ck" href="'+esc(d.checkin)+'" target="_blank" rel="noopener noreferrer">签到</a>';
    }
    return '<td class="act">' + h + '</td>';
  }
  if (!v) return '<td></td>';
  return '<td class="'+(c.cls||'')+'"><span'+(String(v).length>90?' class="clamp3" title="'+esc(v)+'"':'')+'>'+esc(v)+'</span></td>';
}

function render(){
  document.getElementById('headRow').innerHTML = COLS.map(function(c){
    return '<th class="'+(c.cls||'')+'">'+esc(c.label)+'</th>';
  }).join('');
  var html = '', n = 0;
  DATA.forEach(function(d){
    if (matches(d)){ n++; html += '<tr>' + COLS.map(function(c){ return cellHTML(c, d); }).join('') + '</tr>'; }
  });
  document.getElementById('tbody').innerHTML = html;
  document.getElementById('empty').hidden = n > 0;
  document.getElementById('count').textContent = '匹配 ' + n + ' / ' + DATA.length + ' 站';
}

/* ================= 头部统计 / 底部 ================= */
(function init(){
  var ok=0, dead=0, verified=[];
  DATA.forEach(function(d){
    var b = bucketOf(d.status);
    if (b==='ok') ok++; else if (b==='dead') dead++;
    if (d.verified && verified.indexOf(d.verified)<0) verified.push(d.verified);
  });
  document.getElementById('stats').innerHTML =
    '共 <b>'+DATA.length+'</b> 站 · 有效 <b>'+ok+'</b> · 失效/无效 <b>'+dead+'</b>'
    + (verified.length ? ' · 最近验证 <b>'+esc(verified.join('、'))+'</b>' : '')
    + (SITE.updated ? ' · 数据更新于 <b>'+esc(SITE.updated)+'</b>' : '');
  document.getElementById('genInfo').textContent = SITE.updated ? ('数据版本 '+SITE.updated) : '';
  if (UNLOCKED){
    document.getElementById('pvBadge').hidden = false;
    document.getElementById('panel').hidden = false;
    if (CONFIG.editUrl){
      var a = document.getElementById('adminLink');
      a.href = CONFIG.editUrl; a.hidden = false;
    }
    document.getElementById('btnLock').onclick = function(){ location.href = '?k=off'; };
    initSyncPanel();
  }
  buildChips(document.getElementById('statusChips'), STATUS_CHIPS, 'status');
  buildChips(document.getElementById('ratingChips'), RATING_CHIPS, 'rating');
  render();
})();

/* ================= 搜索 ================= */
document.getElementById('q').addEventListener('input', function(e){
  state.q = e.target.value.trim(); render();
});

/* ================= 编辑态:New API 同步面板 ================= */
function initSyncPanel(){
  var dot = document.getElementById('srvDot'), msg = document.getElementById('srvMsg'),
      btn = document.getElementById('btnScan');
  fetch(CONFIG.syncUrl + '/ping').then(function(r){ return r.ok ? r.json() : Promise.reject(0); })
    .then(function(){
      dot.className = 'dot ok';
      msg.textContent = '同步助手已连接(本机)';
      btn.disabled = false;
    })
    .catch(function(){
      dot.className = 'dot bad';
      msg.textContent = '同步助手未启动 — 请先在本机双击 tools/启动同步工具.bat';
    });
  btn.onclick = function(){
    btn.disabled = true; btn.textContent = '检测中…(约10秒)';
    fetch(CONFIG.syncUrl + '/snapshot')
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(data){ showPreview(data); })
      .catch(function(){
        alert('检测失败:同步助手无响应。请确认已双击 tools/启动同步工具.bat,且 New API(localhost:3000)正在运行。');
      })
      .then(function(){ btn.disabled = false; btn.textContent = '检测 New API 渠道'; });
  };
}

function showPreview(data){
  var body = document.getElementById('pvBody');
  var changes = data.changes || [];
  body.innerHTML = changes.map(function(c, i){
    return '<tr>'
      + '<td><input type="checkbox" class="pvck" data-i="'+i+'" checked></td>'
      + '<td>'+esc(c.name)+'</td><td>'+esc(c.fieldLabel||c.field)+'</td>'
      + '<td class="oldv">'+esc(c.old||'(空)')+'</td>'
      + '<td class="newv">'+esc(c.value)+'</td></tr>';
  }).join('');
  document.getElementById('pvEmpty').hidden = changes.length > 0;
  var un = document.getElementById('pvUnmatched');
  if (data.unmatched && data.unmatched.length){
    un.hidden = false;
    un.textContent = '未匹配的渠道(不会写入):' + data.unmatched.join('、');
  } else { un.hidden = true; }
  var mask = document.getElementById('mask');
  mask.hidden = false;
  document.getElementById('pvAll').onchange = function(e){
    var cks = body.querySelectorAll('.pvck');
    for (var i=0;i<cks.length;i++) cks[i].checked = e.target.checked;
  };
  document.getElementById('pvCancel').onclick = function(){ mask.hidden = true; };
  document.getElementById('pvApply').onclick = function(){
    var picked = [];
    var cks = body.querySelectorAll('.pvck');
    for (var i=0;i<cks.length;i++){ if (cks[i].checked) picked.push(changes[+cks[i].getAttribute('data-i')]); }
    if (!picked.length){ alert('未勾选任何变更'); return; }
    this.disabled = true; this.textContent = '写入中…';
    fetch(CONFIG.syncUrl + '/apply', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({changes: picked})
    }).then(function(r){ return r.json(); })
      .then(function(res){
        if (res.ok){
          mask.hidden = true;
          alert('已写入 data.js'
            + (res.pushed ? ',并已推送到远端,网站约 1 分钟内自动更新。' : '(未推送:'+(res.msg||'本地完成,请手动 commit+push')+')')
            + '\n页面即将刷新。');
          location.reload();
        } else { alert('写入失败:'+(res.msg||'未知错误')); }
      })
      .catch(function(){ alert('写入请求失败,请检查同步助手是否仍在运行。'); })
      .then(function(){
        var b = document.getElementById('pvApply');
        b.disabled = false; b.textContent = '确认写入';
      });
  };
}
</script>
</body>
</html>
